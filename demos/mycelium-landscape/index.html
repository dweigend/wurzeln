<!doctype html>
<!--
  Entry point for the independent phased landscape and mycelium MVP.
  Controls remain plain DOM while Three.js owns the WebGL2 presentation.
-->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0913" />
    <link rel="icon" href="data:," />
    <title>Myzel-Landschaft</title>
  </head>
  <body>
    <canvas id="scene" aria-label="Generative Landschaft mit unterirdischem Myzel"></canvas>

    <main class="panel">
      <p class="eyebrow">WEBGL2 LANDSCAPE MVP</p>
      <h1>Myzel-Landschaft</h1>
      <p class="description">
        Erzeuge nacheinander Landschaft, Bäume und ein leuchtendes Netzwerk unter dem Boden.
      </p>

      <label class="control" for="size-slider">
        <span>Größe <output id="size-value">28 m</output></span>
        <input id="size-slider" type="range" min="16" max="48" step="2" value="28" />
      </label>
      <label class="control" for="tree-slider">
        <span>Bäume <output id="tree-value">18</output></span>
        <input id="tree-slider" type="range" min="4" max="80" step="2" value="18" />
      </label>
      <label class="control" for="point-slider">
        <span>Punkte <output id="point-value">500</output></span>
        <input id="point-slider" type="range" min="100" max="2000" step="100" value="500" />
      </label>

      <div class="phases" aria-label="Animationsphasen">
        <button id="terrain-button" type="button">1 Landschaft</button>
        <button id="tree-button" type="button" disabled>2 Bäume</button>
        <button id="subsurface-button" type="button" disabled>3 Boden öffnen</button>
        <button id="growth-button" type="button" disabled>4 Myzel wachsen</button>
      </div>

      <dl class="stats" aria-live="polite">
        <div><dt>Status</dt><dd id="status-value">Bereit</dd></div>
        <div><dt>FPS</dt><dd id="fps-value">0</dd></div>
        <div><dt>p95</dt><dd id="p95-value">0 ms</dd></div>
        <div><dt>Bäume</dt><dd id="tree-count-value">0</dd></div>
        <div><dt>Hyphen</dt><dd id="hypha-value">0</dd></div>
        <div><dt>Dreiecke</dt><dd id="triangle-value">0</dd></div>
      </dl>

      <button id="reset-button" class="reset" type="button">Neue Landschaft</button>
      <p class="hint">
        <a href="/">Alle Experimente</a> · Parameter gelten für die nächste Landschaft
      </p>
    </main>

    <script type="module" src="/src/demos/mycelium-landscape/main.ts"></script>
  </body>
</html>
